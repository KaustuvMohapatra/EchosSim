<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoSim — Living Town</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b1220; color: #e2e8f0;
           font-family: 'Segoe UI', system-ui, sans-serif;
           display: flex; height: 100vh; overflow: hidden; font-size: 13px; }
    #game-container { flex: 1; position: relative; }
    .side { width: 320px; min-width: 280px; background: #101828;
            border-left: 1px solid #1e2a45; display: flex; flex-direction: column; }
    .controls { padding: 8px; display: flex; gap: 6px; flex-wrap: wrap;
                border-bottom: 1px solid #1e2a45; align-items: center; }
    .controls button { background: #16213e; border: 1px solid #24365e;
      color: #7dd3fc; border-radius: 4px; font-size: 12px; padding: 4px 9px;
      cursor: pointer; }
    .controls button:focus-visible { outline: 2px solid #7dd3fc; }
    .hud { padding: 8px 10px; color: #7dd3fc; font-variant-numeric: tabular-nums;
           border-bottom: 1px solid #1e2a45; }
    #agents { flex: 1; overflow-y: auto; padding: 6px; display: grid;
              grid-template-columns: 1fr 1fr; gap: 4px; align-content: start; }
    .agent { text-align: left; background: #16213e; border: 1px solid #24365e;
             color: #cbd5e1; border-radius: 5px; padding: 5px 7px;
             cursor: pointer; font-size: 11px; line-height: 1.35; }
    .agent.sel { border-color: #fbbf24; background: #1e293b; }
    .dim { color: #64748b; }
    #selected { padding: 10px; border-top: 1px solid #1e2a45; min-height: 120px; }
    #selected h3 { color: #7dd3fc; margin-bottom: 6px; }
    .kv { display: flex; justify-content: space-between; margin-bottom: 3px; color: #94a3b8; }
    #feedback { padding: 8px 10px; color: #fde68a; font-size: 12px;
                border-top: 1px solid #1e2a45; min-height: 34px; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div class="side">
    <div class="hud" id="hud">EchoSim</div>
    <div class="controls">
      <button id="btn-pause" aria-label="pause or resume">⏸</button>
      <button id="btn-x1">1×</button>
      <button id="btn-x2">2×</button>
      <button id="btn-x4">4×</button>
      <span style="flex:1"></span>
      <button id="cmd-greet" aria-label="greet">Greet</button>
      <button id="cmd-chat" aria-label="chat">Talk</button>
      <button id="cmd-compliment" aria-label="compliment">Compliment</button>
      <button id="cmd-tease" aria-label="tease">Tease</button>
      <button id="cmd-help" aria-label="help">Help</button>
      <button id="cmd-apologize" aria-label="apologize">Apologize</button>
      <button id="btn-ambient">🔇 ambience</button>
    </div>
    <div id="agents"></div>
    <div id="selected"><i>Select a resident…</i></div>
    <div id="feedback"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
