name: EchoSim Life CI

on:
  push:
    branches: [feature/echosim]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck monorepo
        run: npm run typecheck
      - name: Run regression suite
        run: npm test
      - name: Build Life client
        run: npm run build:life
